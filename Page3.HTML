<html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👩🏻‍🎓 Pendidikan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: little summer, little summer;
            background-color: #A35C7A;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Menyesuaikan tinggi layar */
            text-align: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(45deg, #FFCCE1, #f9a8d4);
            padding: 100px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        h2 {
            color: #8E3E63;
            margin-bottom: 15px;
        }
        p {
            color: #8E3E63;
            font-size: 16px;
            margin: 5px 0;
        }
        strong {
            color: #8E3E63;
        }
        img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 10px;
            margin: 10px 0;
        }
        button {
            background-color: white;
            color: #8E3E63;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 250px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎓 Pendidikan 👩🏻‍🎓</h2>
        <img src="Universitas Tadulako.jpg" alt="Pendidikan">
        <p><strong>🏩 Universitas:</strong> Tadulako</p>
        <p><strong>🏢 Fakultas:</strong> Teknik</p>
        <p><strong>📚 Program Studi:</strong> S1 Sistem Informasi</p>
        <button onclick="window.location.href='Page1.html'">Halaman Utama</button>
        <button onclick="window.location.href='Page2.html'">Kembali ke Halaman 2</button>
    </div>
</body>
</html>
