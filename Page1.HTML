<html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Raiders💫</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: little summer, little summer;
            background-color: #A35C7A;
            color: white;
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #FFCCE1;
            padding: 100px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            margin-bottom: 0.5 em; /* Jarak antara judul utama dan kalimat kedua */
        }
        h3 {
            margin-bottom: 1.0em; /* Jarak antara kalimat kedua dan gambar */
        }
        img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 1.0em; /* Jarak antara gambar dan tombol */
            border: 3px solid white;
            transition: transform 0.3s ease;
        }
        img:hover {
            transform: scale(1.1);
        }
        button {
            background-color: white;
            color: #A35C7A;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin: 20px auto 0;
        }
        button:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome Raiders💫</h1>
        <h3>Enjoy your visit, hope you like it</h3>
        <img src="Welcome.jpg" alt="Welcome">
        <button onclick="window.location.href='Page2.html'">Next Page</button>
    </div>
</body>
</html>
